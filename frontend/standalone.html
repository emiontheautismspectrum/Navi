<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS30 · EdTech AI-агенты (standalone demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
  rel="stylesheet"
/>
<style>
:root {
  --ink: #20242b; --parchment: #f3efe6; --parchment-dim: #e8e1d2;
  --card: #fffdf8; --brass: #a97142; --brass-dim: #c99566;
  --chalk-green: #2f4538; --rule: #d9d0bd; --danger: #a13d3d;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; background: var(--parchment); color: var(--ink); font-family: var(--font-body); }
.app { display: flex; flex-direction: column; height: 100vh; max-width: 880px; margin: 0 auto;
  border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); background: var(--parchment); }
.header { padding: 20px 28px 16px; border-bottom: 1px solid var(--rule); }
.header .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--brass); margin: 0 0 6px; }
.header h1 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 0; letter-spacing: -.01em; }
.config-banner { margin-top: 14px; padding: 10px 12px; border: 1px dashed var(--brass-dim); border-radius: 8px;
  font-family: var(--font-mono); font-size: 11.5px; color: #6b5f45; background: rgba(169,113,66,.06); }
.config-banner input { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--rule);
  border-radius: 4px; padding: 3px 6px; width: 220px; background: #fff; }
.role-tabs { display: flex; gap: 0; margin-top: 16px; border-bottom: 1px solid var(--rule); }
.role-tab { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; padding: 10px 16px;
  background: transparent; border: none; border-bottom: 2px solid transparent; color: #756e5e; cursor: pointer; }
.role-tab:hover { color: var(--ink); }
.role-tab.active { color: var(--chalk-green); border-bottom-color: var(--brass); font-weight: 600; }
.messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
.msg { max-width: 82%; line-height: 1.5; font-size: 14.5px; }
.msg.user { align-self: flex-end; background: var(--chalk-green); color: #f3efe6; padding: 10px 14px;
  border-radius: 10px 10px 2px 10px; }
.msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--rule); padding: 12px 16px;
  border-radius: 10px 10px 10px 2px; white-space: pre-wrap; }
.msg.assistant .sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--rule);
  font-family: var(--font-mono); font-size: 11px; color: #8a8168; }
.msg.assistant .sources span { display: block; margin-top: 2px; }
.msg.error { align-self: flex-start; color: var(--danger); font-family: var(--font-mono); font-size: 13px; }
.empty-state { margin: auto; text-align: center; color: #9a917a; font-family: var(--font-mono); font-size: 13px; max-width: 340px; }
.composer { border-top: 1px solid var(--rule); padding: 16px 28px 20px; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; font-family: var(--font-body); font-size: 14px; padding: 10px 12px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--card); color: var(--ink); min-height: 44px; max-height: 140px; }
.composer button { font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; padding: 12px 18px;
  background: var(--chalk-green); color: #f3efe6; border: none; border-radius: 8px; cursor: pointer; }
.composer button:disabled { background: var(--parchment-dim); color: #a49b84; cursor: not-allowed; }
.upload-btn { font-family: var(--font-mono); font-size: 11px; color: var(--brass); background: none;
  border: 1px dashed var(--brass-dim); border-radius: 8px; padding: 10px 12px; cursor: pointer; white-space: nowrap; }
.typing { align-self: flex-start; font-family: var(--font-mono); font-size: 12px; color: #9a917a; }
.disclaimer { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; padding: 9px 12px;
  border: 1px solid var(--brass-dim); border-left: 3px solid var(--brass); border-radius: 6px;
  background: rgba(169,113,66,.07); font-family: var(--font-mono); font-size: 11px; line-height: 1.45; color: #6b5f45; }
.disclaimer::before { content: "!"; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; margin-top: 1px; border-radius: 50%; background: var(--brass); color: var(--parchment);
  font-size: 10px; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + ReactDOM + Babel from CDN — работает без npm install и без сборки -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useRef, useEffect } = React;

const ROLES = [
  { id: "student", label: "Студент" },
  { id: "teacher", label: "Преподаватель" },
  { id: "admin", label: "Админ. сотрудник" },
];
const ROLE_HINTS = {
  student: "Спросите про задание, срок сдачи или попросите объяснить тему",
  teacher: "Спросите про учебный план, регламент или попросите суммаризацию",
  admin: "Спросите про регламент, процедуру или срок рассмотрения заявления",
};

// FastAPI отдаёт detail строкой (наши HTTPException) либо массивом объектов
// (валидация pydantic, 422). Без нормализации массив превратился бы
// в "[object Object]" — пользователь не увидел бы причину сбоя.
function formatError(err, status) {
  const detail = err && err.detail;
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) {
    return detail
      .map((d) => {
        const field = Array.isArray(d.loc) ? d.loc.join(".") : "";
        return field ? `${field}: ${d.msg}` : d.msg;
      })
      .join("; ");
  }
  return `Ошибка сервера: ${status}`;
}

function App() {
  const [apiBase, setApiBase] = useState(
    localStorage.getItem("nexus30_api_base") || "http://localhost:8000"
  );
  const [role, setRole] = useState("student");
  const [historyByRole, setHistoryByRole] = useState({ student: [], teacher: [], admin: [] });
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    localStorage.setItem("nexus30_api_base", apiBase);
  }, [apiBase]);

  const messages = historyByRole[role];

  function appendMessage(targetRole, msg) {
    setHistoryByRole((prev) => ({ ...prev, [targetRole]: [...prev[targetRole], msg] }));
  }

  async function handleSend() {
    const text = input.trim();
    if (!text || loading) return;
    appendMessage(role, { role: "user", content: text });
    setInput("");
    setLoading(true);
    try {
      // отфильтровываем служебные сообщения об ошибках (role: "error"):
      // backend принимает только "user"/"assistant", иначе после первой
      // ошибки чат этой роли ломается насовсем (422) до перезагрузки
      const history = messages
        .filter((m) => m.role === "user" || m.role === "assistant")
        .map((m) => ({ role: m.role, content: m.content }));
      const res = await fetch(`${apiBase}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role, message: text, history }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(formatError(err, res.status));
      }
      const data = await res.json();
      appendMessage(role, { role: "assistant", content: data.reply, sources: data.sources });
    } catch (e) {
      appendMessage(role, { role: "error", content: e.message + " (проверьте, что backend запущен и адрес API верный)" });
    } finally {
      setLoading(false);
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  }

  async function handleFileUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    appendMessage(role, { role: "user", content: `📄 Загружен документ «${file.name}» — запрос на суммаризацию` });
    setLoading(true);
    try {
      const res = await fetch(`${apiBase}/summarize`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role, text }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(formatError(err, res.status));
      }
      const data = await res.json();
      appendMessage(role, { role: "assistant", content: data.summary, sources: [] });
    } catch (err) {
      appendMessage(role, { role: "error", content: err.message });
    } finally {
      setLoading(false);
      e.target.value = "";
    }
  }

  return (
    <div className="app">
      <header className="header">
        <p className="eyebrow">NEXUS30 · EdTech · Yandex track</p>
        <h1>Экосистема AI-агентов университета</h1>
        <div className="config-banner">
          Адрес backend:{" "}
          <input value={apiBase} onChange={(e) => setApiBase(e.target.value)} />
          {" "}(меняйте только если backend запущен не на localhost:8000)
        </div>
        <nav className="role-tabs">
          {ROLES.map((r) => (
            <button key={r.id} className={`role-tab ${role === r.id ? "active" : ""}`} onClick={() => setRole(r.id)}>
              {r.label}
            </button>
          ))}
        </nav>
        <p className="disclaimer">
          Ответы агента носят справочно-рекомендательный характер и не являются
          официальным решением, приказом или позицией университета. По вопросам,
          требующим официального решения, обращайтесь в соответствующее подразделение.
        </p>
      </header>

      <main className="messages">
        {messages.length === 0 && <div className="empty-state">{ROLE_HINTS[role]}</div>}
        {messages.map((m, i) => (
          <div key={i} className={`msg ${m.role}`}>
            {m.content}
            {m.role === "assistant" && m.sources && m.sources.length > 0 && (
              <div className="sources">
                источники:
                {m.sources.map((s) => (
                  <span key={s.id}>{s.title} — релевантность {s.score}</span>
                ))}
              </div>
            )}
          </div>
        ))}
        {loading && <div className="typing">агент печатает…</div>}
      </main>

      <div className="composer">
        <button className="upload-btn" onClick={() => fileInputRef.current?.click()} title="Загрузить документ для суммаризации">
          + документ
        </button>
        <input ref={fileInputRef} type="file" accept=".txt,.md" style={{ display: "none" }} onChange={handleFileUpload} />
        <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown}
          placeholder="Напишите сообщение агенту…" rows={1} />
        <button onClick={handleSend} disabled={loading || !input.trim()}>Отправить</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
