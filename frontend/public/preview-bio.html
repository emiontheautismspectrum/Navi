<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Navi — биолюминесцентная версия</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  /* Ночь: глубокий сине-зелёный, не чёрный и не синий */
  --abyss:       #071310;
  --deep:        #0B1E1B;
  --surface:     #102A26;
  --surface-hi:  #16352F;
  --rule:        #1E4741;

  /* Свечение: бирюза — основное, фиолет — вторичное */
  --glow:        #3FE0BC;
  --glow-soft:   #7FF0D8;
  --violet:      #9B8CFF;

  /* Тёплый противовес, чтобы палитра не ушла в холод */
  --amber:       #F0A860;

  --text:        #E4F4EF;
  --text-dim:    #8FB3AC;
  --text-faint:  #5C817B;

  --font-display: "Sora", system-ui, sans-serif;
  --font-body:    "Manrope", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;

  --sidebar-w: 268px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }

body {
  background: var(--abyss);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Атмосферное свечение — «дышит» медленно, как биолюминесценция */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  background:
    radial-gradient(38% 32% at 18% 12%, rgba(63,224,188,.13), transparent 70%),
    radial-gradient(34% 30% at 82% 78%, rgba(155,140,255,.10), transparent 70%),
    radial-gradient(50% 40% at 50% 110%, rgba(63,224,188,.06), transparent 70%);
  pointer-events: none;
  z-index: 0;
  animation: breathe 14s var(--ease) infinite alternate;
}
@keyframes breathe {
  from { opacity: .75; transform: scale(1); }
  to   { opacity: 1;   transform: scale(1.06); }
}

.shell { position: relative; z-index: 1; display: flex; height: 100%; }

/* ─────────────── SIDEBAR ─────────────── */
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  border-right: 1px solid var(--rule);
  background: linear-gradient(180deg, rgba(11,30,27,.92), rgba(7,19,16,.92));
  backdrop-filter: blur(8px);
  display: flex;
  flex-direction: column;
  padding: 22px 16px 16px;
  transition: transform .42s var(--ease), opacity .3s ease;
}
.sidebar.hidden { transform: translateX(calc(-1 * var(--sidebar-w))); opacity: 0; }

/* появление сайдбара при загрузке: элементы всплывают по очереди */
.reveal { opacity: 0; transform: translateY(10px); animation: rise .55s var(--ease) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }

.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; margin-bottom: 26px; }
.mark {
  width: 26px; height: 26px; flex: none;
  border-radius: 50%;
  border: 1.5px solid var(--glow);
  position: relative;
  box-shadow: 0 0 14px rgba(63,224,188,.45), inset 0 0 8px rgba(63,224,188,.2);
}
.mark::after {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--glow);
  box-shadow: 0 0 10px var(--glow);
  animation: pulse 3.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

.brand h1 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
.brand span { display: block; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); margin-top: 2px; }

.side-label {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--text-faint);
  padding: 0 6px; margin: 0 0 10px;
}

.roles { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.role {
  text-align: left; width: 100%;
  background: transparent; border: 1px solid transparent;
  border-radius: 10px; padding: 10px 12px; cursor: pointer;
  color: var(--text-dim); font-family: var(--font-body); font-size: 13.5px;
  display: flex; align-items: center; gap: 10px;
  transition: background .2s ease, color .2s ease, border-color .2s ease;
}
.role:hover { background: var(--surface); color: var(--text); }
.role .dot {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--text-faint); transition: all .25s ease;
}
.role.active {
  background: var(--surface-hi); color: var(--text);
  border-color: var(--rule); font-weight: 600;
}
.role.active .dot { background: var(--glow); box-shadow: 0 0 10px var(--glow); }
.role:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.access {
  margin: 10px 6px 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(63,224,188,.06);
  border: 1px solid rgba(63,224,188,.16);
  font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5;
  color: var(--glow-soft);
}
.access b { display: block; font-weight: 500; color: var(--text-faint); letter-spacing: .12em; text-transform: uppercase; font-size: 9px; margin-bottom: 5px; }

.history { flex: 1; overflow-y: auto; margin-top: 24px; }
.history-item {
  width: 100%; text-align: left; background: transparent; border: none;
  color: var(--text-dim); font-family: var(--font-body); font-size: 12.5px;
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .18s ease, color .18s ease;
}
.history-item:hover { background: var(--surface); color: var(--text); }
.history-empty { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); padding: 0 12px; line-height: 1.6; }

.side-foot { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 12px; }
.side-foot p { font-family: var(--font-mono); font-size: 9.5px; line-height: 1.6; color: var(--text-faint); margin: 0; }

/* ─────────────── MAIN ─────────────── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 24px; border-bottom: 1px solid var(--rule);
}
.icon-btn {
  background: transparent; border: 1px solid var(--rule); border-radius: 8px;
  width: 32px; height: 32px; cursor: pointer; color: var(--text-dim);
  display: grid; place-items: center; transition: all .2s ease; flex: none;
}
.icon-btn:hover { color: var(--glow); border-color: var(--glow); }
.icon-btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.topbar .ctx { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); }

.scroll { flex: 1; overflow-y: auto; }

/* Стартовый экран */
.hero {
  min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px; text-align: center;
}
.hero-title {
  font-family: var(--font-display); font-weight: 300;
  font-size: clamp(28px, 4.2vw, 46px); line-height: 1.12;
  letter-spacing: -.03em; margin: 0 0 12px; max-width: 700px;
}
.hero-title b { font-weight: 700; color: var(--glow); }
.hero-sub { color: var(--text-dim); font-size: 14.5px; margin: 0 0 34px; max-width: 520px; line-height: 1.6; }

.searchbox {
  width: 100%; max-width: 660px; position: relative;
  border: 1px solid var(--rule); border-radius: 16px;
  background: rgba(16,42,38,.7);
  transition: border-color .25s ease, box-shadow .25s ease;
}
.searchbox:focus-within {
  border-color: var(--glow);
  box-shadow: 0 0 0 3px rgba(63,224,188,.12), 0 0 28px rgba(63,224,188,.12);
}
.searchbox textarea {
  width: 100%; background: transparent; border: none; resize: none;
  color: var(--text); font-family: var(--font-body); font-size: 15px;
  padding: 18px 58px 18px 20px; min-height: 60px; max-height: 160px; line-height: 1.5;
}
.searchbox textarea:focus { outline: none; }
.searchbox textarea::placeholder { color: var(--text-faint); }
.send {
  position: absolute; right: 12px; bottom: 12px;
  width: 34px; height: 34px; border-radius: 10px; border: none;
  background: var(--glow); color: var(--abyss); cursor: pointer;
  display: grid; place-items: center; transition: all .2s ease;
}
.send:hover:not(:disabled) { box-shadow: 0 0 18px rgba(63,224,188,.5); transform: translateY(-1px); }
.send:disabled { background: var(--surface-hi); color: var(--text-faint); cursor: default; }
.send:focus-visible { outline: 2px solid var(--glow-soft); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; max-width: 660px; }
.chip {
  font-family: var(--font-body); font-size: 12.5px;
  background: rgba(16,42,38,.6); color: var(--text-dim);
  border: 1px solid var(--rule); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
  transition: all .22s ease;
}
.chip:hover:not(:disabled) { color: var(--text); border-color: var(--glow); background: rgba(63,224,188,.08); }
.chip:disabled { opacity: .45; cursor: default; }
.chip:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

/* Лента ответов */
.thread { max-width: 780px; margin: 0 auto; padding: 32px 24px 40px; }
.turn { margin-bottom: 44px; animation: rise .5s var(--ease) both; }

.q {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(20px, 2.6vw, 27px); line-height: 1.3;
  letter-spacing: -.02em; margin: 0 0 22px; color: var(--text);
}

.block-label {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px;
}
.block-label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

/* Источники как карточки со шкалой свечения = релевантность */
.sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 26px; }
.source {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 12px; padding: 12px 13px;
  transition: border-color .22s ease, transform .22s ease;
}
.source:hover { border-color: rgba(63,224,188,.45); transform: translateY(-2px); }
.source .n {
  font-family: var(--font-mono); font-size: 9.5px; color: var(--glow);
  display: block; margin-bottom: 6px;
}
.source .t { font-size: 12.5px; line-height: 1.45; color: var(--text); display: block; margin-bottom: 10px; }
.bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar i {
  display: block; height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--violet), var(--glow));
  box-shadow: 0 0 8px rgba(63,224,188,.6);
  transform-origin: left; animation: fill .8s var(--ease) both;
}
@keyframes fill { from { transform: scaleX(0); } }
.rel { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); margin-top: 5px; display: block; }

.answer { font-size: 15.5px; line-height: 1.72; color: var(--text); white-space: pre-wrap; }
.answer::first-letter { color: var(--glow-soft); }

.err {
  font-family: var(--font-mono); font-size: 12.5px; color: var(--amber);
  border-left: 2px solid var(--amber); padding-left: 12px;
}

/* Индикатор загрузки — три светящиеся точки */
.thinking { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
.thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--glow); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .18s; }
.thinking i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; box-shadow: 0 0 8px var(--glow); } }

/* Нижняя строка ввода в режиме диалога */
.followup { border-top: 1px solid var(--rule); padding: 14px 24px 18px; background: rgba(7,19,16,.7); backdrop-filter: blur(6px); }
.followup .searchbox { max-width: 780px; margin: 0 auto; }
.followup .searchbox textarea { min-height: 50px; padding: 14px 54px 14px 18px; font-size: 14px; }

.disclaimer-bar {
  max-width: 780px; margin: 8px auto 0;
  font-family: var(--font-mono); font-size: 9.5px; color: var(--text-faint);
  text-align: center; line-height: 1.5;
}

/* Мобильные */
.scrim { display: none; }
@media (max-width: 860px) {
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30;
    box-shadow: 0 0 40px rgba(0,0,0,.5);
  }
  .scrim {
    display: block; position: fixed; inset: 0; z-index: 20;
    background: rgba(3,10,9,.6); backdrop-filter: blur(2px);
    animation: fade .3s ease both;
  }
  @keyframes fade { from { opacity: 0; } }
  .thread, .followup { padding-left: 16px; padding-right: 16px; }
  .sources { grid-template-columns: 1fr 1fr; }
  .hero { padding: 24px 16px; }
}
@media (max-width: 520px) {
  .sources { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, body::before { animation: none !important; transition: none !important; }
}

::-webkit-scrollbar { width: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--surface-hi); }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useRef, useEffect } = React;

// Если открыт локально с localhost — бьём в локальный backend, иначе в боевой.
const API_BASE =
  location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://localhost:8000"
    : "https://navi-backend-2x2q.onrender.com";

const ROLES = [
  { id: "student", label: "Студент" },
  { id: "teacher", label: "Преподаватель" },
  { id: "admin", label: "Админ. сотрудник" },
];

const ROLE_ACCESS = {
  student: "Силлабусы, задания, регламенты для студентов",
  teacher: "Учебные планы, методические материалы кафедры",
  admin: "Внутренние регламенты, документооборот деканата",
};

const ROLE_PROMPTS = {
  student: [
    "Когда сдавать курсовой проект по базам данных?",
    "Как подать апелляцию по результатам экзамена?",
    "Что нужно сделать в задании №5?",
  ],
  teacher: [
    "Что в методических рекомендациях кафедры?",
    "Какие сроки проведения сессии?",
    "Кратко изложи учебный план курса",
  ],
  admin: [
    "Сколько рассматривается заявление на академический отпуск?",
    "Как регистрируются входящие заявления студентов?",
    "Какие общие правила расписания сессии?",
  ],
};

const HERO = {
  student: ["Что нужно", "узнать?"],
  teacher: ["Что посмотреть", "в материалах?"],
  admin: ["Что найти", "в документах?"],
};

function formatError(err, status) {
  const d = err && err.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map((x) => x.msg).join("; ");
  return `Ошибка сервера: ${status}`;
}

async function ask(role, message, history) {
  const res = await fetch(`${API_BASE}/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ role, message, history }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(formatError(e, res.status));
  }
  return res.json();
}

function App() {
  const [role, setRole] = useState("student");
  const [byRole, setByRole] = useState({ student: [], teacher: [], admin: [] });
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [sidebar, setSidebar] = useState(true);
  const [narrow, setNarrow] = useState(window.innerWidth <= 860);
  const scrollRef = useRef(null);

  const turns = byRole[role];

  useEffect(() => {
    function onResize() {
      const n = window.innerWidth <= 860;
      setNarrow(n);
      if (n) setSidebar(false);
    }
    onResize();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [turns.length, loading]);

  async function send(preset) {
    const text = (preset ?? input).trim();
    if (!text || loading) return;
    setInput("");
    setLoading(true);

    const history = turns.flatMap((t) =>
      t.answer
        ? [
            { role: "user", content: t.question },
            { role: "assistant", content: t.answer },
          ]
        : []
    );

    const turn = { question: text, answer: null, sources: [], error: null };
    setByRole((p) => ({ ...p, [role]: [...p[role], turn] }));

    try {
      const data = await ask(role, text, history);
      setByRole((p) => {
        const list = [...p[role]];
        list[list.length - 1] = { ...turn, answer: data.reply, sources: data.sources || [] };
        return { ...p, [role]: list };
      });
    } catch (e) {
      setByRole((p) => {
        const list = [...p[role]];
        list[list.length - 1] = { ...turn, error: e.message };
        return { ...p, [role]: list };
      });
    } finally {
      setLoading(false);
    }
  }

  function onKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  }

  const empty = turns.length === 0;
  const [h1, h2] = HERO[role];

  const composer = (
    <div className="searchbox">
      <textarea
        value={input}
        onChange={(e) => setInput(e.target.value)}
        onKeyDown={onKey}
        placeholder="Спросите о документах университета…"
        rows={1}
      />
      <button className="send" onClick={() => send()} disabled={loading || !input.trim()} aria-label="Отправить">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 12h13M12 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  );

  return (
    <div className="shell">
      {narrow && sidebar && <div className="scrim" onClick={() => setSidebar(false)} />}

      <aside className={`sidebar ${sidebar ? "" : "hidden"}`}>
        <div className="brand reveal" style={{ animationDelay: "0ms" }}>
          <div className="mark" />
          <div>
            <h1>Navi</h1>
            <span>AI-навигатор</span>
          </div>
        </div>

        <p className="side-label reveal" style={{ animationDelay: "70ms" }}>Роль</p>
        <div className="roles reveal" style={{ animationDelay: "110ms" }}>
          {ROLES.map((r) => (
            <button
              key={r.id}
              className={`role ${role === r.id ? "active" : ""}`}
              onClick={() => { setRole(r.id); if (narrow) setSidebar(false); }}
            >
              <span className="dot" />
              {r.label}
            </button>
          ))}
        </div>

        <div className="access reveal" style={{ animationDelay: "170ms" }}>
          <b>Доступно этой роли</b>
          {ROLE_ACCESS[role]}
        </div>

        <div className="history reveal" style={{ animationDelay: "230ms" }}>
          <p className="side-label">История</p>
          {turns.length === 0 ? (
            <p className="history-empty">Диалогов пока нет. У каждой роли история своя.</p>
          ) : (
            turns.map((t, i) => (
              <button key={i} className="history-item" title={t.question}>{t.question}</button>
            ))
          )}
        </div>

        <div className="side-foot reveal" style={{ animationDelay: "290ms" }}>
          <p>Ответы носят рекомендательный характер и не являются официальным решением университета.</p>
        </div>
      </aside>

      <div className="main">
        <div className="topbar">
          <button className="icon-btn" onClick={() => setSidebar((s) => !s)} aria-label="Показать или скрыть панель">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <span className="ctx">{ROLES.find((r) => r.id === role).label}</span>
        </div>

        <div className="scroll" ref={scrollRef}>
          {empty ? (
            <div className="hero">
              <h2 className="hero-title reveal" style={{ animationDelay: "60ms" }}>
                {h1} <b>{h2}</b>
              </h2>
              <p className="hero-sub reveal" style={{ animationDelay: "120ms" }}>
                Задайте вопрос по документам университета. Ответ будет собран
                только из тех материалов, которые доступны вашей роли.
              </p>
              <div className="reveal" style={{ animationDelay: "180ms", width: "100%", display: "flex", justifyContent: "center" }}>
                {composer}
              </div>
              <div className="chips reveal" style={{ animationDelay: "240ms" }}>
                {ROLE_PROMPTS[role].map((q) => (
                  <button key={q} className="chip" onClick={() => send(q)} disabled={loading}>{q}</button>
                ))}
              </div>
            </div>
          ) : (
            <div className="thread">
              {turns.map((t, i) => (
                <div className="turn" key={i}>
                  <h2 className="q">{t.question}</h2>

                  {t.sources && t.sources.length > 0 && (
                    <>
                      <div className="block-label">Источники</div>
                      <div className="sources">
                        {t.sources.map((s, j) => (
                          <div className="source" key={s.id || j}>
                            <span className="n">{String(j + 1).padStart(2, "0")}</span>
                            <span className="t">{s.title}</span>
                            <div className="bar">
                              <i style={{ width: `${Math.min(100, Math.round(s.score * 100 * 2.2))}%` }} />
                            </div>
                            <span className="rel">релевантность {s.score}</span>
                          </div>
                        ))}
                      </div>
                    </>
                  )}

                  <div className="block-label">Ответ</div>
                  {t.error ? (
                    <p className="err">{t.error}</p>
                  ) : t.answer ? (
                    <div className="answer">{t.answer}</div>
                  ) : (
                    <div className="thinking"><i /><i /><i /> собираю ответ</div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>

        {!empty && (
          <div className="followup">
            {composer}
            <p className="disclaimer-bar">
              Ответы носят справочно-рекомендательный характер и не являются официальным решением университета.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
