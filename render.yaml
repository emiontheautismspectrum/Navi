# Render Blueprint — деплой backend + frontend одним кликом.
#
# Как использовать:
# 1. Render Dashboard → New → Blueprint → выберите репозиторий Navi.
# 2. Render прочитает этот файл и создаст оба сервиса ниже.
# 3. В navi-backend → Environment впишите YANDEX_API_KEY и YANDEX_FOLDER_ID
#    (в файле они намеренно пустые: репозиторий публичный, секреты в нём
#    хранить нельзя).
# 4. Если backend получит другой адрес, поменяйте VITE_API_BASE ниже
#    и сделайте Manual Deploy фронтенда: Vite подставляет переменные
#    при сборке, поэтому сохранения значения в панели недостаточно.

services:
  # ── Backend: FastAPI + RAG + LLM ────────────────────────────────────────
  - type: web
    name: navi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: yandex
      - key: YANDEX_API_KEY
        sync: false        # вписывается вручную в панели Render
      - key: YANDEX_FOLDER_ID
        sync: false        # вписывается вручную в панели Render
      - key: PYTHON_VERSION
        value: 3.12.0

  # ── Frontend: React + Vite, статическая сборка ──────────────────────────
  # Пути указаны от корня репозитория (без rootDir) — так требует
  # спецификация Blueprint для статических сайтов.
  - type: web
    name: navi-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Реальный адрес backend. Раньше здесь стоял плейсхолдер, и при
      # каждой синхронизации Blueprint он перезаписывал значение,
      # выставленное в панели, — фронтенд начинал стучаться в никуда.
      - key: VITE_API_BASE
        value: https://navi-backend-2x2q.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA-роутинг
