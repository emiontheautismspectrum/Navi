# Render Blueprint — деплой backend + frontend одним кликом.
#
# Как использовать:
# 1. Render Dashboard → New → Blueprint → выберите репозиторий Navi.
# 2. Render прочитает этот файл и создаст оба сервиса ниже.
# 3. В navi-backend → Environment впишите YANDEX_API_KEY и YANDEX_FOLDER_ID
#    (в файле они намеренно пустые: репозиторий публичный, секреты в нём
#    хранить нельзя).
# 4. После первого деплоя backend скопируйте его URL и впишите
#    в VITE_API_BASE у navi-frontend, затем сделайте Manual Deploy фронта.

services:
  # ── Backend: FastAPI + RAG + LLM ────────────────────────────────────────
  - type: web
    name: navi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: yandex
      - key: YANDEX_API_KEY
        sync: false        # вписывается вручную в панели Render
      - key: YANDEX_FOLDER_ID
        sync: false        # вписывается вручную в панели Render
      - key: PYTHON_VERSION
        value: 3.12.0

  # ── Frontend: React + Vite, статическая сборка ──────────────────────────
  # Пути указаны от корня репозитория (без rootDir) — так требует
  # спецификация Blueprint для статических сайтов.
  - type: web
    name: navi-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # ЗАМЕНИТЕ на реальный URL backend после его первого деплоя,
      # затем сделайте Manual Deploy фронтенда (Vite встраивает
      # переменную в момент сборки, а не во время выполнения).
      - key: VITE_API_BASE
        value: https://navi-backend.onrender.com
    routes:
      # Правила проверяются по порядку. Явное правило для превью идёт
      # первым, иначе общий SPA-роутинг ниже перехватил бы этот путь
      # и вместо нового дизайна отдавал бы основной интерфейс.
      - type: rewrite
        source: /preview-bio.html
        destination: /preview-bio.html
      - type: rewrite
        source: /*
        destination: /index.html   # SPA-роутинг
